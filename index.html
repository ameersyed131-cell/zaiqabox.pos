// ===== POS GUARD =====
const GUARD_USER='ZAIQABOX', GUARD_PASS='HKGN@786';
function PosAuthGuard({children}) {
  const [authed,setAuthed]=useState(()=>sessionStorage.getItem('zb_pos_auth')==='1');
  const [u,setU]=useState(''),[p,setP]=useState(''),[err,setErr]=useState('');
  const s=getSettings();
  const login=(e)=>{e.preventDefault();if(u===GUARD_USER&&p===GUARD_PASS){sessionStorage.setItem('zb_pos_auth','1');setAuthed(true);}else setErr('Invalid credentials');};
  if(authed) return children;
  return (
    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-orange-50 to-amber-100 p-4">
      <div className="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
        <div className="text-center mb-6">
          <div className="w-16 h-16 bg-primary rounded-2xl flex items-center justify-center mx-auto mb-3"><span className="text-white font-bold text-2xl">{s.restaurant_name.charAt(0)}</span></div>
          <h1 className="text-2xl font-bold">{s.restaurant_name}</h1><p className="text-mutedfg text-sm">POS System — Enter credentials</p>
        </div>
        <form onSubmit={login} className="space-y-3">
          <input value={u} onChange={e=>setU(e.target.value)} placeholder="Username" className="w-full px-4 py-2.5 border border-border rounded-lg outline-none focus:ring-2 focus:ring-primary"/>
          <input type="password" value={p} onChange={e=>setP(e.target.value)} placeholder="Password" className="w-full px-4 py-2.5 border border-border rounded-lg outline-none focus:ring-2 focus:ring-primary"/>
          {err&&<p className="text-destructive text-sm">{err}</p>}
          <button className="w-full bg-primary text-white py-2.5 rounded-lg font-semibold hover:bg-orange-600 transition">Login</button>
        </form>
      </div>
    </div>
  );
}

// ===== DASHBOARD =====
function Dashboard({goto}){
  const orders=DB.get('orders',[]);
  const today=new Date().toDateString();
  const todayOrders=orders.filter(o=>new Date(o.created_date).toDateString()===today);
  const revenue=todayOrders.reduce((s,o)=>s+o.total,0);
  const totalOrders=orders.length;
  const totalRevenue=orders.reduce((s,o)=>s+o.total,0);
  const stats=[{l:"Today's Revenue",v:'₹'+revenue.toFixed(0),i:'Dollar',c:'text-green-600'},{l:"Today's Orders",v:todayOrders.length,i:'Cart',c:'text-blue-600'},{l:'Total Orders',v:totalOrders,i:'History',c:'text-orange-600'},{l:'Total Revenue',v:'₹'+totalRevenue.toFixed(0),i:'TrendUp',c:'text-purple-600'}];
  const days=[];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const dstr=d.toDateString();const total=orders.filter(o=>new Date(o.created_date).toDateString()===dstr).reduce((s,o)=>s+o.total,0);days.push({d:d.toLocaleDateString('en-IN',{weekday:'short'}),total});}
  const maxDay=Math.max(...days.map(d=>d.total),1);
  const recent=orders.slice(-10).reverse();
  return (
    <div>
      <h1 className="text-2xl font-bold mb-1">Dashboard</h1>
      <p className="text-mutedfg text-sm mb-6">Business overview</p>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        {stats.map((s,i)=>(
          <div key={i} className="bg-white rounded-xl border border-border p-5 shadow-sm">
            <div className={`w-10 h-10 rounded-lg bg-muted flex items-center justify-center mb-2 ${s.c}`}>{React.createElement(I[s.i],{className:'w-5 h-5'})}</div>
            <p className="text-2xl font-bold">{s.v}</p><p className="text-sm text-mutedfg">{s.l}</p>
          </div>
        ))}
      </div>
      <div className="bg-white rounded-xl border border-border p-5 shadow-sm mb-6">
        <h2 className="font-semibold mb-4">Revenue (Last 7 Days)</h2>
        <div className="flex items-end justify-between gap-2 h-48">
          {days.map((d,i)=>(<div key={i} className="flex-1 flex flex-col items-center gap-2"><div className="w-full bg-primary rounded-t-lg" style={{height:(d.total/maxDay*100)+'%',minHeight:'4px'}}></div><span className="text-xs text-mutedfg">{d.d}</span></div>))}
        </div>
      </div>
      <div className="bg-white rounded-xl border border-border p-5 shadow-sm">
        <div className="flex justify-between items-center mb-4"><h2 className="font-semibold">Recent Orders</h2><button onClick={()=>goto('history')} className="text-sm text-primary font-medium">View All</button></div>
        {recent.length===0?<p className="text-center text-mutedfg py-8">No orders yet</p>:(
          <div className="overflow-x-auto"><table className="w-full text-sm">
            <thead><tr className="border-b border-border text-left text-mutedfg"><th className="py-2 px-2">Order #</th><th className="py-2 px-2">Customer</th><th className="py-2 px-2">Type</th><th className="py-2 px-2">Total</th><th className="py-2 px-2">Date</th></tr></thead>
            <tbody>{recent.map(o=>(<tr key={o.id} className="border-b border-border/50"><td className="py-2 px-2 font-medium">{o.order_number}</td><td className="py-2 px-2">{o.customer_name||'-'}</td><td className="py-2 px-2">{o.order_type}</td><td className="py-2 px-2 font-semibold">₹{o.total.toFixed(0)}</td><td className="py-2 px-2 text-mutedfg text-xs">{toIST(o.created_date)}</td></tr>))}</tbody>
          </table></div>
        )}
      </div>
    </div>
  );
}

// ===== NEW ORDER =====
function NewOrder({goto}){
  const s=getSettings();
  const [search,setSearch]=useState(''),[cat,setCat]=useState('All'),[cart,setCart]=useState([]);
  const [receipt,setReceipt]=useState(null);
  const [orderType,setOrderType]=useState('Dine In'),[tableNumber,setTableNumber]=useState('');
  const [customerName,setCustomerName]=useState(''),[customerPhone,setCustomerPhone]=useState('');
  const [paymentMethod,setPaymentMethod]=useState('Cash'),[notes,setNotes]=useState(''),[discount,setDiscount]=useState(0);
  const [showCustDrop,setShowCustDrop]=useState(false);
  const menu=DB.get('menu',[]);
  const allCust=DB.get('customers',[]);
  const matchedCust=allCust.filter(c=>(customerName&&c.name?.toLowerCase().includes(customerName.toLowerCase()))||(customerPhone&&c.phone?.includes(customerPhone))).slice(0,5);
  const cats=['All',...new Set(menu.filter(i=>i.is_available!==false).map(i=>i.category))];
  const filtered=menu.filter(i=>i.is_available!==false&&(cat==='All'||i.category===cat)&&(!search||i.name.toLowerCase().includes(search.toLowerCase())));
  const addToCart=(item)=>setCart(c=>{const e=c.find(x=>x.item_id===item.id);if(e)return c.map(x=>x.item_id===item.id?{...x,quantity:x.quantity+1}:x);return [...c,{item_id:item.id,name:item.name,price:item.price,quantity:1}];});
  const updateQty=(id,d)=>setCart(c=>c.map(x=>x.item_id===id?{...x,quantity:x.quantity+d}:x).filter(x=>x.quantity>0));
  const removeItem=(id)=>setCart(c=>c.filter(x=>x.item_id!==id));
  const subtotal=cart.reduce((s,i)=>s+i.price*i.quantity,0);
  const taxRate=(s.tax_rate||5)/100;
  const tax=subtotal*taxRate;
  const total=Math.max(0,subtotal+tax-(discount||0));
  const placeOrder=()=>{
    if(cart.length===0)return;
    const orders=DB.get('orders',[]);
    const order={id:'o'+Date.now(),order_number:(s.bill_prefix||'ORD')+'-'+Math.floor(Math.random()*9000+1000),order_type:orderType,table_number:orderType==='Dine In'?tableNumber:'',customer_name:customerName,customer_phone:customerPhone,items:cart.map(c=>({item_id:c.item_id,name:c.name,price:c.price,quantity:c.quantity,total:c.price*c.quantity})),subtotal,tax,discount:discount||0,total,payment_method:paymentMethod,status:'Completed',notes,created_date:new Date().toISOString()};
    orders.push(order);DB.set('orders',orders);
    // Save customer for CRM
    if(customerPhone){
      const customers=DB.get('customers',[]);
      const ex=customers.find(c=>c.phone===customerPhone);
      if(ex){ex.visit_count=(ex.visit_count||0)+1;ex.total_spent=(ex.total_spent||0)+total;ex.last_visit=order.created_date;}
      else customers.push({id:'c'+Date.now(),name:customerName||'Walk-in',phone:customerPhone,visit_count:1,total_spent:total,last_visit:order.created_date});
      DB.set('customers',customers);
    }
    if(orderType==='Dine In'&&tableNumber){const tables=DB.get('tables',[]).map(t=>t.table_number===tableNumber?{...t,status:'Occupied'}:t);DB.set('tables',tables);}
    setCart([]);setCustomerName('');setCustomerPhone('');setTableNumber('');setNotes('');setDiscount(0);
    setReceipt(order);
  };
  return (
    <div className="flex flex-col gap-4 md:gap-6">
      <div className="w-full">
        <h1 className="text-2xl font-bold mb-1">New Order</h1>
        <p className="text-mutedfg text-sm mb-4">Select items to create an order</p>
        <div className="relative mb-4"><I.Search className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-mutedfg"/><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search menu items..." className="w-full pl-9 pr-3 py-2 border border-border rounded-lg bg-white"/></div>
        <div className="flex gap-2 overflow-x-auto mb-4 pb-1">{cats.map(c=><button key={c} onClick={()=>setCat(c)} className={`px-4 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap transition ${cat===c?'bg-primary text-white':'bg-white border border-border hover:bg-muted'}`}>{c}</button>)}</div>
        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
          {filtered.map(item=>(
            <button key={item.id} onClick={()=>addToCart(item)} className="bg-white rounded-xl border border-border p-3 text-left hover:shadow-md hover:border-primary transition group">
              <div className="flex items-start gap-2 mb-1">
                <span className="flex-shrink-0 mt-0.5 w-4 h-4 border-2 rounded-sm flex items-center justify-center" style={{borderColor:item.is_veg?'#16a34a':'#dc2626'}}><span className="w-2 h-2 rounded-full" style={{background:item.is_veg?'#16a34a':'#dc2626'}}></span></span>
                <p className="font-semibold text-sm leading-tight">{item.name}</p>
              </div>
              {item.description&&<p className="text-xs text-mutedfg mb-1">{item.description}</p>}
              <div className="flex items-center justify-between mt-1">
                <span className="font-bold text-primary">₹{item.price}</span>
                <span className="w-7 h-7 rounded-full bg-primary/10 flex items-center justify-center group-hover:bg-primary group-hover:text-white transition"><I.Plus className="w-4 h-4"/></span>
              </div>
            </button>
          ))}
        </div>
        {filtered.length===0&&<p className="text-center text-mutedfg py-12">No items found</p>}
      </div>
      <div className="w-full">
        <div className="bg-white rounded-xl border border-border shadow-sm flex flex-col">
          <div className="p-4 border-b flex justify-between items-center"><h2 className="font-semibold flex items-center gap-2"><I.Cart className="w-5 h-5 text-primary"/>Current Order</h2>{cart.length>0&&<button onClick={()=>setCart([])} className="text-sm text-destructive">Clear</button>}</div>
          <div className="p-4 space-y-3 flex-1 overflow-y-auto max-h-[50vh]">
            <div className="grid grid-cols-2 gap-2">
              <div><label className="text-xs text-mutedfg block mb-1">Order Type</label><select value={orderType} onChange={e=>setOrderType(e.target.value)} className="w-full px-2 py-1.5 border border-border rounded-md text-sm bg-white"><option>Dine In</option><option>Takeaway</option><option>Delivery</option></select></div>
              {orderType==='Dine In'&&<div><label className="text-xs text-mutedfg block mb-1">Table #</label><input value={tableNumber} onChange={e=>setTableNumber(e.target.value)} className="w-full px-2 py-1.5 border border-border rounded-md text-sm"/></div>}
            </div>
            <div className="grid grid-cols-2 gap-2 relative">
              <div><label className="text-xs text-mutedfg block mb-1">Customer Name</label><input value={customerName} onChange={e=>{setCustomerName(e.target.value);setShowCustDrop(true);}} onFocus={()=>setShowCustDrop(true)} onBlur={()=>setTimeout(()=>setShowCustDrop(false),200)} className="w-full px-2 py-1.5 border border-border rounded-md text-sm"/></div>
              <div><label className="text-xs text-mutedfg block mb-1">Phone (for WhatsApp)</label><input value={customerPhone} onChange={e=>{setCustomerPhone(e.target.value);setShowCustDrop(true);}} onFocus={()=>setShowCustDrop(true)} onBlur={()=>setTimeout(()=>setShowCustDrop(false),200)} placeholder="+91..." className="w-full px-2 py-1.5 border border-border rounded-md text-sm"/></div>
              {showCustDrop&&matchedCust.length>0&&(
                <div className="absolute top-full left-0 right-0 mt-1 bg-white border border-border rounded-lg shadow-lg z-20 max-h-40 overflow-y-auto">
                  {matchedCust.map(c=>(<button key={c.id} onMouseDown={()=>{setCustomerName(c.name);setCustomerPhone(c.phone);setShowCustDrop(false);}} className="w-full text-left px-3 py-2 hover:bg-muted text-sm border-b border-border/50"><span className="font-medium">{c.name}</span> <span className="text-mutedfg">{c.phone}</span> <span className="text-xs text-mutedfg">({c.visit_count||1} visits)</span></button>))}
                </div>
              )}
            </div>
            <div className="grid grid-cols-2 gap-2">
              <div><label className="text-xs text-mutedfg block mb-1">Payment</label><select value={paymentMethod} onChange={e=>setPaymentMethod(e.target.value)} className="w-full px-2 py-1.5 border border-border rounded-md text-sm bg-white"><option>Cash</option><option>Card</option><option>UPI</option><option>Online</option></select></div>
              <div><label className="text-xs text-mutedfg block mb-1">Discount ₹</label><input type="number" min="0" value={discount} onChange={e=>setDiscount(Number(e.target.value))} className="w-full px-2 py-1.5 border border-border rounded-md text-sm"/></div>
            </div>
            <hr className="border-border"/>
            {cart.length===0?<div className="text-center py-8 text-mutedfg"><I.Cart className="w-10 h-10 mx-auto mb-2 opacity-30"/><p className="text-sm">No items added yet</p></div>:cart.map(item=>(
              <div key={item.item_id} className="flex items-center gap-2 p-2 rounded-lg bg-muted/50">
                <div className="flex-1 min-w-0"><p className="text-sm font-medium leading-tight">{item.name}</p><p className="text-xs text-mutedfg">₹{item.price} each</p></div>
                <div className="flex items-center gap-1"><button onClick={()=>updateQty(item.item_id,-1)} className="w-6 h-6 border border-border rounded flex items-center justify-center"><I.Minus className="w-3 h-3"/></button><span className="w-6 text-center text-sm font-semibold">{item.quantity}</span><button onClick={()=>updateQty(item.item_id,1)} className="w-6 h-6 border border-border rounded flex items-center justify-center"><I.Plus className="w-3 h-3"/></button></div>
                <span className="text-sm font-semibold w-14 text-right">₹{(item.price*item.quantity).toFixed(0)}</span>
                <button onClick={()=>removeItem(item.item_id)} className="text-destructive"><I.Trash className="w-4 h-4"/></button>
              </div>
            ))}
            {cart.length>0&&<div><label className="text-xs text-mutedfg block mb-1">Special Instructions</label><textarea value={notes} onChange={e=>setNotes(e.target.value)} className="w-full px-2 py-1.5 border border-border rounded-md text-sm h-14 resize-none"/></div>}
          </div>
          {cart.length>0&&(
            <div className="p-4 border-t space-y-2">
              <div className="flex justify-between text-sm text-mutedfg"><span>Subtotal</span><span>₹{subtotal.toFixed(2)}</span></div>
              <div className="flex justify-between text-sm text-mutedfg"><span>Tax ({s.tax_rate||5}%)</span><span>₹{tax.toFixed(2)}</span></div>
              {discount>0&&<div className="flex justify-between text-sm text-green-600"><span>Discount</span><span>-₹{discount.toFixed(2)}</span></div>}
              <div className="flex justify-between font-bold text-base"><span>Total</span><span>₹{total.toFixed(2)}</span></div>
              <button onClick={placeOrder} className="w-full bg-primary text-white py-2.5 rounded-lg font-semibold hover:bg-orange-600 transition">Place Order — ₹{total.toFixed(2)}</button>
            </div>
          )}
        </div>
      </div>
      {receipt&&<ReceiptModal order={receipt} onClose={()=>{setReceipt(null);goto('history');}}/>}
    </div>
  );
}

// ===== RECEIPT =====
const THANK={'Dine In':['Thank you for dining with us! We hope to see you again soon.','It was a pleasure serving you. Come back soon!'],'Takeaway':['Thank you for your order! Enjoy your meal.','Thanks for choosing us. Bon appétit!'],'Delivery':['Thank you for ordering! Enjoy your delivery.','We hope you enjoy your meal. Thanks for ordering!']};
function getThank(t){const m=THANK[t]||THANK['Dine In'];return m[Math.floor(Math.random()*m.length)];}
function ReceiptModal({order,onClose}){
  const s=getSettings();
  const thank=getThank(order.order_type);
  const name=s.restaurant_name.toUpperCase();
  const sendWhatsApp=()=>{
    const phone=order.customer_phone?.replace(/[^0-9]/g,'');if(!phone)return;
    const lines=[`*${s.restaurant_name}*`,'',`Order: ${order.order_number}`,`Date: ${toIST(order.created_date)}`,`Type: ${order.order_type}`];
    if(order.table_number)lines.push(`Table: ${order.table_number}`);
    if(order.customer_name)lines.push(`Customer: ${order.customer_name}`);
    if(order.payment_method)lines.push(`Payment: ${order.payment_method}`);
    lines.push('','--- Items ---');
    order.items.forEach(i=>lines.push(`${i.name} x${i.quantity} = ₹${(i.price*i.quantity).toFixed(0)}`));
    lines.push('',`Subtotal: ₹${order.subtotal.toFixed(2)}`,`Tax: ₹${order.tax.toFixed(2)}`);
    if(order.discount>0)lines.push(`Discount: -₹${order.discount.toFixed(2)}`);
    lines.push(`*Grand Total: ₹${order.total.toFixed(2)}*`,'',thank,'','Powered by www.faizcodex.com');
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(lines.join('\n'))}`,'_blank');
  };
  const shareBill=async()=>{
    const el=document.getElementById('receipt-content');if(!el)return;
    try{const canvas=await html2canvas(el,{scale:2,backgroundColor:'#ffffff'});
      canvas.toBlob(async(blob)=>{
        if(!blob)return;
        const file=new File([blob],'bill-'+order.order_number+'.png',{type:'image/png'});
        if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
          await navigator.share({files:[file],title:'Bill '+order.order_number,text:'Your bill from '+s.restaurant_name});
        }else{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='bill-'+order.order_number+'.png';a.click();URL.revokeObjectURL(url);}
      });}catch(e){}
  };
  const printReceipt=()=>{
    const w=window.open('','_blank','width=400,height=600');
    w.document.write(`<!DOCTYPE html><html><head><title>Receipt ${order.order_number}</title><meta charset="UTF-8"><style>@page{size:80mm auto;margin:0}html,body{height:auto;min-height:0}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter','Segoe UI',Arial,sans-serif;font-size:13px;line-height:1.4;width:80mm;max-width:80mm;margin:0 auto;padding:8px 6px 6px 6px;color:#000;background:#fff}.center{text-align:center}.bold{font-weight:700}.big{font-size:17px;font-weight:800;letter-spacing:1.2px}.dashed{border-top:1px dashed #000;margin:6px 0}.solid{border-top:2px solid #000;margin:6px 0}.row{display:flex;justify-content:space-between;margin:2px 0}.item-name{flex:1;padding-right:8px;word-break:break-word;font-weight:600;font-size:13px}.item-qty{width:32px;text-align:center;font-weight:600}.item-rate{width:52px;text-align:right}.item-amt{width:58px;text-align:right;font-weight:600}.total-row{display:flex;justify-content:space-between;font-weight:700;font-size:13px;padding:3px 0}.grand-total{font-size:18px;font-weight:800;padding:6px 0}.footer{text-align:center;margin-top:8px;font-size:11px;line-height:1.5}.watermark{font-size:10px;font-weight:600;text-align:center;color:#333;margin-top:10px;border-top:1px dotted #999;padding-top:6px}.watermark a{color:#333;text-decoration:none;font-weight:700}</style></head><body>
<div class="center"><div class="big">${name}</div><div style="font-size:11px;margin-top:2px;font-weight:500">Restaurant & Cafe</div>${s.fssai?`<div style="font-size:10px;margin-top:3px;color:#555">FSSAI Lic. No.: ${s.fssai}</div>`:''}</div>
<div class="dashed"></div>
<div class="row"><span>Order #:</span><span style="font-weight:800;font-size:11px;white-space:nowrap">${order.order_number}</span></div>
<div class="row"><span>Date:</span><span class="bold" style="white-space:nowrap">${toIST(order.created_date)}</span></div>
<div class="row"><span>Type:</span><span class="bold">${order.order_type}</span></div>
${order.table_number?`<div class="row"><span>Table:</span><span class="bold">${order.table_number}</span></div>`:''}
${order.customer_name?`<div class="row"><span>Customer:</span><span class="bold">${order.customer_name}</span></div>`:''}
${order.payment_method?`<div class="row"><span>Payment:</span><span class="bold">${order.payment_method}</span></div>`:''}
<div class="dashed"></div>
${order.items.map(i=>`<div class="row"><span class="item-name">${i.name}</span><span class="item-qty">${i.quantity}</span><span class="item-rate">₹${i.price.toFixed(2)}</span><span class="item-amt">₹${(i.price*i.quantity).toFixed(2)}</span></div>`).join('')}
<div class="dashed"></div>
<div class="row"><span>Subtotal</span><span>₹${order.subtotal.toFixed(2)}</span></div>
<div class="row"><span>Tax</span><span>₹${order.tax.toFixed(2)}</span></div>
${order.discount>0?`<div class="row"><span>Discount</span><span>-₹${order.discount.toFixed(2)}</span></div>`:''}
<div class="solid"></div>
<div class="total-row grand-total"><span>GRAND TOTAL</span><span>₹${order.total.toFixed(2)}</span></div>
<div class="solid"></div>
<div class="footer"><div>${thank}</div><div style="margin-top:4px">*** Prices inclusive of all taxes ***</div></div>
<div class="watermark">${s.restaurant_name} POS &mdash; Powered by <a href="https://www.faizcodex.com">www.faizcodex.com</a></div>
</body></html>`);
    w.document.close();setTimeout(()=>w.print(),300);
  };
  return (
    <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 no-print" onClick={onClose}>
      <div className="bg-white rounded-xl max-w-sm w-full max-h-[90vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
        <div className="p-4 border-b flex justify-between items-center">
          <h2 className="font-semibold">Receipt Preview</h2>
          <div className="flex gap-2">
            <button onClick={printReceipt} className="px-3 py-1.5 border border-border rounded-md text-sm flex items-center gap-1"><I.Printer className="w-4 h-4"/>Print</button>
            {order.customer_phone&&<button onClick={sendWhatsApp} className="px-3 py-1.5 border border-border rounded-md text-sm flex items-center gap-1"><I.WhatsApp className="w-4 h-4"/>Share</button>}
            <button onClick={onClose} className="p-1.5"><I.X className="w-4 h-4"/></button>
          </div>
        </div>
        <div id="receipt-content" className="p-4 bg-white" style={{fontFamily:'Inter,sans-serif'}}>
          <div className="text-center"><p className="text-base font-bold tracking-widest">{name}</p><p className="text-[10px]">Restaurant & Cafe</p>{s.fssai&&<p className="text-[9px] text-gray-400">FSSAI Lic. No.: {s.fssai}</p>}</div>
          <div className="border-t border-dashed border-gray-400 my-2"/>
          <div className="space-y-0.5 text-[10px] text-gray-500">
            <div className="flex justify-between"><span>Order #:</span><span className="font-bold text-black whitespace-nowrap">{order.order_number}</span></div>
            <div className="flex justify-between"><span>Date:</span><span className="whitespace-nowrap">{toIST(order.created_date)}</span></div>
            <div className="flex justify-between"><span>Type:</span><span>{order.order_type}</span></div>
            {order.table_number&&<div className="flex justify-between"><span>Table:</span><span>{order.table_number}</span></div>}
            {order.customer_name&&<div className="flex justify-between"><span>Customer:</span><span>{order.customer_name}</span></div>}
            {order.payment_method&&<div className="flex justify-between"><span>Payment:</span><span>{order.payment_method}</span></div>}
          </div>
          <div className="border-t border-dashed border-gray-400 my-2"/>
          {order.items.map((i,idx)=><div key={idx} className="flex text-sm mb-1.5 font-medium"><span className="flex-1 pr-1 leading-tight">{i.name}</span><span className="w-8 text-center font-bold">{i.quantity}</span><span className="w-14 text-right">₹{i.price.toFixed(0)}</span><span className="w-16 text-right font-bold">₹{(i.price*i.quantity).toFixed(0)}</span></div>)}

// ===== REPORTS =====
function Reports(){
  const [reportDate,setReportDate]=useState(new Date().toISOString().split('T')[0]);
  const [expDesc,setExpDesc]=useState(''),[expAmt,setExpAmt]=useState(''),[expCat,setExpCat]=useState('Inventory');
  const orders=DB.get('orders',[]),expenses=DB.get('expenses',[]);
  const dayOrders=orders.filter(o=>o.created_date&&new Date(o.created_date).toDateString()===new Date(reportDate).toDateString());
  const dayExpenses=expenses.filter(e=>e.date===reportDate);
  const totalSales=dayOrders.reduce((s,o)=>s+o.total,0);
  const totalExp=dayExpenses.reduce((s,e)=>s+e.amount,0);
  const net=totalSales-totalExp;
  const last7=[];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const dStr=d.toISOString().split('T')[0];const sales=orders.filter(o=>o.created_date&&new Date(o.created_date).toDateString()===d.toDateString()).reduce((s,o)=>s+o.total,0);const exp=expenses.filter(e=>e.date===dStr).reduce((s,e)=>s+e.amount,0);last7.push({dStr,label:d.toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short'}),sales,exp,net:sales-exp});}
  const addExpense=()=>{if(!expDesc||!expAmt)return;const all=DB.get('expenses',[]);all.push({id:'e'+Date.now(),description:expDesc,amount:Number(expAmt),category:expCat,date:reportDate});DB.set('expenses',all);setExpDesc('');setExpAmt('');};
  const delExp=(id)=>{DB.set('expenses',DB.get('expenses',[]).filter(e=>e.id!==id));};
  return (
    <div>
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6"><div><h1 className="text-2xl font-bold">Reports</h1><p className="text-mutedfg text-sm">Daily sales & expense tracking (12 AM - 12 AM)</p></div><div><label className="text-xs text-mutedfg block">Report Date</label><input type="date" value={reportDate} onChange={e=>setReportDate(e.target.value)} className="w-44 px-2 py-1.5 border border-border rounded-lg bg-white"/></div></div>
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
        <div className="bg-green-50 border border-green-200 rounded-xl p-5"><div className="flex items-center gap-3 mb-2"><div className="w-10 h-10 rounded-lg bg-green-100 flex items-center justify-center"><I.Dollar className="w-5 h-5 text-green-600"/></div><div><p className="text-sm text-mutedfg">Total Sales</p><p className="text-2xl font-bold text-green-700">₹{totalSales.toFixed(0)}</p></div></div><p className="text-xs text-mutedfg">{dayOrders.length} orders</p></div>
        <div className="bg-red-50 border border-red-200 rounded-xl p-5"><div className="flex items-center gap-3 mb-2"><div className="w-10 h-10 rounded-lg bg-red-100 flex items-center justify-center"><I.TrendDown className="w-5 h-5 text-red-600"/></div><div><p className="text-sm text-mutedfg">Total Expenses</p><p className="text-2xl font-bold text-red-700">₹{totalExp.toFixed(0)}</p></div></div><p className="text-xs text-mutedfg">{dayExpenses.length} entries</p></div>
        <div className={`${net>=0?'bg-blue-50 border-blue-200':'bg-orange-50 border-orange-200'} border rounded-xl p-5`}><div className="flex items-center gap-3 mb-2"><div className={`w-10 h-10 rounded-lg flex items-center justify-center ${net>=0?'bg-blue-100':'bg-orange-100'}`}><I.TrendUp className={`w-5 h-5 ${net>=0?'text-blue-600':'text-orange-600'}`}/></div><div><p className="text-sm text-mutedfg">Net Profit</p><p className={`text-2xl font-bold ${net>=0?'text-blue-700':'text-orange-700'}`}>₹{net.toFixed(0)}</p></div></div><p className="text-xs text-mutedfg">{net>=0?'Profit':'Loss'}</p></div>
      </div>
      <div className="bg-white rounded-xl border border-border p-5 shadow-sm mb-6">
        <h2 className="font-semibold mb-3">Add Expense</h2>
        <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
          <div><label className="text-xs text-mutedfg block mb-1">Description</label><input value={expDesc} onChange={e=>setExpDesc(e.target.value)} placeholder="e.g. Vegetables" className="w-full px-3 py-2 border border-border rounded-lg"/></div>
          <div><label className="text-xs text-mutedfg block mb-1">Amount ₹</label><input type="number" value={expAmt} onChange={e=>setExpAmt(e.target.value)} placeholder="0" className="w-full px-3 py-2 border border-border rounded-lg"/></div>
          <div><label className="text-xs text-mutedfg block mb-1">Category</label><select value={expCat} onChange={e=>setExpCat(e.target.value)} className="w-full px-3 py-2 border border-border rounded-lg bg-white"><option>Inventory</option><option>Utilities</option><option>Salaries</option><option>Rent</option><option>Maintenance</option><option>Other</option></select></div>
          <div className="flex items-end"><button onClick={addExpense} className="w-full bg-primary text-white px-4 py-2 rounded-lg flex items-center justify-center gap-1"><I.Plus className="w-4 h-4"/>Add</button></div>
        </div>
      </div>
      {dayExpenses.length>0&&(
        <div className="bg-white rounded-xl border border-border shadow-sm mb-6 overflow-x-auto">
          <table className="w-full text-sm"><thead><tr className="border-b border-border text-left text-mutedfg"><th className="py-3 px-4">Description</th><th className="py-3 px-4">Category</th><th className="py-3 px-4">Amount</th><th className="py-3 px-4"></th></tr></thead>
            <tbody>{dayExpenses.map(e=>(<tr key={e.id} className="border-b border-border/50"><td className="py-3 px-4 font-medium">{e.description}</td><td className="py-3 px-4">{e.category}</td><td className="py-3 px-4 font-semibold text-red-600">₹{e.amount.toFixed(0)}</td><td className="py-3 px-4"><button onClick={()=>delExp(e.id)} className="text-destructive"><I.Trash className="w-4 h-4"/></button></td></tr>))}</tbody>
          </table>
        </div>
      )}
      <div className="bg-white rounded-xl border border-border shadow-sm overflow-x-auto">
        <h2 className="font-semibold p-5 pb-3">7-Day Summary</h2>
        <table className="w-full text-sm"><thead><tr className="border-b border-border text-left text-mutedfg"><th className="py-3 px-4">Date</th><th className="py-3 px-4">Sales</th><th className="py-3 px-4">Expenses</th><th className="py-3 px-4">Net</th></tr></thead>
          <tbody>{last7.map(d=>(<tr key={d.dStr} className={`border-b border-border/50 ${d.dStr===reportDate?'bg-primary/5':''}`}><td className="py-3 px-4 font-medium">{d.label}</td><td className="py-3 px-4 text-green-600">₹{d.sales.toFixed(0)}</td><td className="py-3 px-4 text-red-600">₹{d.exp.toFixed(0)}</td><td className={`py-3 px-4 font-semibold ${d.net>=0?'text-blue-600':'text-orange-600'}`}>₹{d.net.toFixed(0)}</td></tr>))}</tbody>
        </table>
      </div>
    </div>
  );
}

// ===== SETTINGS =====
function SettingsPage(){
  const [s,setS]=useState(getSettings());
  const [saved,setSaved]=useState(false);
  const save=(e)=>{e.preventDefault();saveSettings(s);setSaved(true);setTimeout(()=>setSaved(false),2000);};
  return (
    <div className="max-w-2xl">
      <h1 className="text-2xl font-bold mb-1">Settings</h1>
      <p className="text-mutedfg text-sm mb-6">Configure your restaurant POS</p>
      <form onSubmit={save} className="bg-white rounded-xl border border-border p-6 shadow-sm space-y-4">
        <div><label className="text-sm font-medium block mb-1">Restaurant Name</label><input value={s.restaurant_name} onChange={e=>setS({...s,restaurant_name:e.target.value})} className="w-full px-3 py-2 border border-border rounded-lg"/><p className="text-xs text-mutedfg mt-1">This name appears on sidebar, receipts, and throughout the POS.</p></div>
        <div><label className="text-sm font-medium block mb-1">FSSAI License Number</label><input value={s.fssai} onChange={e=>setS({...s,fssai:e.target.value})} placeholder="e.g. 10020042012345" className="w-full px-3 py-2 border border-border rounded-lg"/></div>
        <div><label className="text-sm font-medium block mb-1">Address</label><input value={s.address} onChange={e=>setS({...s,address:e.target.value})} className="w-full px-3 py-2 border border-border rounded-lg"/></div>
        <div className="grid grid-cols-2 gap-3"><div><label className="text-sm font-medium block mb-1">Phone</label><input value={s.phone} onChange={e=>setS({...s,phone:e.target.value})} className="w-full px-3 py-2 border border-border rounded-lg"/></div><div><label className="text-sm font-medium block mb-1">Bill Prefix</label><input value={s.bill_prefix} onChange={e=>setS({...s,bill_prefix:e.target.value})} placeholder="e.g. ORD" className="w-full px-3 py-2 border border-border rounded-lg"/></div></div>
        <div className="grid grid-cols-2 gap-3"><div><label className="text-sm font-medium block mb-1">Tax Rate (%)</label><input type="number" value={s.tax_rate} onChange={e=>setS({...s,tax_rate:Number(e.target.value)})} className="w-full px-3 py-2 border border-border rounded-lg"/></div><div><label className="text-sm font-medium block mb-1">Currency</label><input value={s.currency} onChange={e=>setS({...s,currency:e.target.value})} className="w-full px-3 py-2 border border-border rounded-lg"/></div></div>
        <div className="flex gap-2 pt-2"><button type="submit" className="px-6 py-2 bg-primary text-white rounded-lg font-semibold">Save Settings</button>{saved&&<span className="text-green-600 text-sm self-center">Saved!</span>}</div>
      </form>
      <div className="mt-6 bg-white rounded-xl border border-border p-6 shadow-sm">
        <h2 className="font-semibold mb-2">Data Management</h2>
        <p className="text-sm text-mutedfg mb-3">All data stored locally in browser.</p>
        <div className="flex gap-2">
          <button onClick={()=>{const data={menu:DB.get('menu'),orders:DB.get('orders'),tables:DB.get('tables'),customers:DB.get('customers'),expenses:DB.get('expenses'),settings:DB.get('settings')};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='pos-backup.json';a.click();}} className="px-4 py-2 border border-border rounded-lg text-sm">Export Data</button>
          <button onClick={()=>{if(confirm('Reset ALL data?')){['menu','orders','tables','customers','expenses','settings'].forEach(k=>localStorage.removeItem('zb_'+k));location.reload();}}} className="px-4 py-2 border border-destructive text-destructive rounded-lg text-sm">Reset All Data</button>
        </div>
      </div>
    </div>
  );
}

// ===== APP =====
function App(){
  const [page,setPage]=useState('dashboard');
  return (
    <PosAuthGuard>
      <div className="min-h-screen bg-background">
        <Sidebar page={page} setPage={setPage}/>
        <main className="md:ml-60 p-4 md:p-6 pb-20 md:pb-6">
          {page==='dashboard'&&<Dashboard goto={setPage}/>}
          {page==='new'&&<NewOrder goto={setPage}/>}
          {page==='history'&&<OrderHistory/>}
          {page==='menu'&&<MenuManagement/>}
          {page==='tables'&&<Tables/>}
          {page==='customers'&&<CustomerData/>}
          {page==='reports'&&<Reports/>}
          {page==='settings'&&<SettingsPage/>}
          {page==='more'&&<MoreMenu page={page} setPage={setPage}/>}
        </main>
        <BottomNav page={page} setPage={setPage}/>
      </div>
    </PosAuthGuard>
  );
}

createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
